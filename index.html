<!DOCTYPE html>
<html lang="en">
<head> 
  <title> Eman | Web Developer</title>
    <meta name="description" content=" Eman - Web Developer and Front-End Developer">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>To-Do List</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f4f4f4;
      color: #222;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: 0.3s;
    }

    body.dark {
      background: #121212;
      color: white;
    }

    .container {
      width: 400px;
      background: white;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.15);
    }

    body.dark .container {
      background: #1e1e1e;
    }

    h1 {
      text-align: center;
      margin-bottom: 20px;
    }

    .input-box {
      display: flex;
      gap: 10px;
    }

    input {
      flex: 1;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      outline: none;
    }

    button {
      padding: 10px 15px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      background: #4f46e5;
      color: white;
    }

    .theme-btn {
      width: 100%;
      margin-top: 15px;
      background: #333;
    }

    ul {
      list-style: none;
      margin-top: 20px;
    }

    li {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #f1f1f1;
      padding: 12px;
      margin-bottom: 10px;
      border-radius: 8px;
    }

    body.dark li {
      background: #333;
    }

    li.completed span {
      text-decoration: line-through;
      opacity: 0.5;
    }

    .delete {
      background: #ef4444;
      padding: 6px 10px;
    }
  </style>
</head>

<body>

  <div class="container">
    <h1>📝 To-Do List</h1>

    <div class="input-box">
      <input type="text" id="taskInput" placeholder="Enter a task...">
      <button onclick="addTask()">Add</button>
    </div>

    <ul id="taskList"></ul>

    <button class="theme-btn" onclick="toggleTheme()">
      🌙 Toggle Theme
    </button>
  </div>

  <script>
    const taskInput = document.getElementById("taskInput");
    const taskList = document.getElementById("taskList");

    function addTask() {
      const task = taskInput.value.trim();

      if (task === "") {
        alert("Please enter a task!");
        return;
      }

      const li = document.createElement("li");

      li.innerHTML = `
        <span onclick="completeTask(this)">${task}</span>
        <button class="delete" onclick="deleteTask(this)">Delete</button>
      `;

      taskList.appendChild(li);
      taskInput.value = "";
    }

    function completeTask(element) {
      element.parentElement.classList.toggle("completed");
    }

    function deleteTask(button) {
      button.parentElement.remove();
    }

    function toggleTheme() {
      document.body.classList.toggle("dark");
    }

    taskInput.addEventListener("keypress", function(event) {
      if (event.key === "Enter") {
        addTask();
      }
    });
  </script>

</body>
</html>
